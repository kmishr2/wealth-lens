services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wealth_lens
      POSTGRES_USER: wealth_lens
      POSTGRES_PASSWORD: wealth_lens
    ports:
      - "5432:5432"
    volumes:
      - wealth_lens_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth_lens -d wealth_lens"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  wealth_lens_db:
